<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A flexible personal photo album.">
    <title>Album · Marcus Chen</title>
    <link rel="stylesheet" href="../style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="wordmark" href="../index.html" aria-label="Marcus Chen, home">MC<span>.</span></a>
        <nav aria-label="Primary navigation"><a href="../index.html">Academic homepage</a></nav>
      </div>
    </header>

    <main class="inner-page shell">
      <div class="page-intro album-intro">
        <p class="eyebrow">Personal archive</p>
        <h1>Album</h1>
        <p>A small visual diary beyond academic work. The flexible mosaic accepts landscape, portrait, square, and full-width photographs.</p>
        <a class="back-link" href="../index.html">← Back to academic homepage</a>
      </div>

      <div class="photo-grid" aria-label="Photo gallery">
        <!--
          EDIT: Replace a .photo-placeholder with:
          <img class="album-photo" src="../assets/your-photo.jpg" alt="Describe the photo">

          Flexible sizes:
          photo-card-wide       full width
          photo-card-landscape  horizontal
          photo-card-portrait   vertical
          photo-card-square     square
        -->
        <figure class="photo-card photo-card-wide">
          <div class="photo-placeholder" role="img" aria-label="Photo 01 placeholder"><span>Photo 01</span><small>Replace this block with an image</small></div>
          <figcaption><span>Madison, Wisconsin</span><time>August 2026</time></figcaption>
        </figure>
        <figure class="photo-card photo-card-portrait">
          <div class="photo-placeholder" role="img" aria-label="Photo 02 placeholder"><span>Photo 02</span><small>Replace this block with an image</small></div>
          <figcaption><span>A conference afternoon</span><time>July 2026</time></figcaption>
        </figure>
        <figure class="photo-card photo-card-landscape">
          <div class="photo-placeholder" role="img" aria-label="Photo 03 placeholder"><span>Photo 03</span><small>Replace this block with an image</small></div>
          <figcaption><span>Lake Mendota</span><time>June 2026</time></figcaption>
        </figure>
        <figure class="photo-card photo-card-square">
          <div class="photo-placeholder" role="img" aria-label="Photo 04 placeholder"><span>Photo 04</span><small>Replace this block with an image</small></div>
          <figcaption><span>On the road</span><time>May 2026</time></figcaption>
        </figure>
        <figure class="photo-card photo-card-landscape">
          <div class="photo-placeholder" role="img" aria-label="Photo 05 placeholder"><span>Photo 05</span><small>Replace this block with an image</small></div>
          <figcaption><span>Department life</span><time>April 2026</time></figcaption>
        </figure>
        <figure class="photo-card photo-card-wide">
          <div class="photo-placeholder" role="img" aria-label="Photo 06 placeholder"><span>Photo 06</span><small>Replace this block with an image</small></div>
          <figcaption><span>A quiet weekend</span><time>March 2026</time></figcaption>
        </figure>
      </div>
    </main>

    <footer class="site-footer">
      <div class="shell footer-inner"><p>© 2026 Marcus Chen</p><p>Last updated August 2026</p></div>
    </footer>
  </body>
</html>
